<head>
	<meta charset="utf-8" />
	<title>RB-Cloud</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimal-ui" />
	<!-- android -->
	<meta name="mobile-web-app-capable" content="yes">
	<!-- iOS -->
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<link rel="stylesheet" href="maui/css/mobile-angular-ui-base.min.css" />
	<link rel="stylesheet" href="maui/css/mobile-angular-ui-hover.min.css" />

	<link rel="stylesheet" href="css/main.css" />
	<script src="maui/js/angular.min.js"></script>
	<script src="maui/js/angular-ui-router.min.js"></script>
	<script src="maui/js/mobile-angular-ui.min.js"></script>
	<script src="maui/js/mobile-angular-ui.gestures.min.js"></script>
	<script src="js/main.js"></script>
	<script src="plates/js/home.js"></script>
	<script src="js/chart.js"></script>
	<script src="js/luxon.min.js"></script>
	<script src="js/chartjs-adapter-luxon.umd.min.js"></script>
	<script src="plates/js/charts.js"></script>
	<script src="plates/js/settings.js"></script>
	<script src="plates/js/pro.js"></script>
</head>

<body ng-app="rbcloud" ng-controller="MainCtrl" ui-prevent-touchmove-defaults id="body">
	<div ui-yield-to="modals"></div>
	<div ui-track-as-search-param='true' class="sidebar sidebar-left">
		<div class="scrollable">
			<h3 class="scrollable-header app-name">RB-Cloud</h3>
			<div class="scrollable-content">
				<div class="list-group" ui-turn-off='uiSidebarLeft'>
					<a class="list-group-item" href="#/"><i class="fa fa-home"></i> Summary <i
							class="fa fa-chevron-right pull-right"></i></a>					
					<a class="list-group-item" href="#/charts"><i class="fa fa-bar-chart"></i> Charts <i
							class="fa fa-chevron-right pull-right"></i></a>
					<a class="list-group-item" href="#/logbook"><i class="fa fa-suitcase"></i> Pilot Logbook <i
							class="fa fa-chevron-right pull-right"></i></a>
					<a class="list-group-item" href="#/documents"><i class="fa fa-paperclip"></i> Documents <i
							class="fa fa-chevron-right pull-right"></i></a>
					<a class="list-group-item" href="#/maintenance"><i class="fa fa-wrench"></i> Maintenance <i
							class="fa fa-chevron-right pull-right"></i></a>
					<a class="list-group-item" href="#/engineanalisys"><i class="fa fa-check"></i> Engine Analisys <i
							class="fa fa-chevron-right pull-right"></i></a>
					<a class="list-group-item" href="#/live"><i class="fa fa-feed"></i> Live Monitoring <i
							class="fa fa-chevron-right pull-right"></i></a>
					<a class="list-group-item" href="#/settings"><i class="fa fa-gear"></i> Settings <i
							class="fa fa-chevron-right pull-right"></i></a>
				</div>
			</div>
		</div>
	</div>
	<!-- Define Right (Help) Sidebar -->
	<div class="sidebar sidebar-right">
		<div class="scrollable">
			<h3 class="scrollable-header app-name">Help</h3>
			<div class="scrollable-content">
				<div class="list-group" ui-toggle="uiSidebarRight">
					<div ng-include="helppage"></div>
				</div>
			</div>
		</div>
	</div>


	<div class="app" ui-swipe-right='swipeLeft()' ui-swipe-left='swipeRight()'>

		<!-- Create Header Navbar with left Menu Button -->
		<div class="navbar navbar-app navbar-absolute-top">
			<div class="navbar-brand navbar-brand-center" ui-yield-to="title">
				<a href="#/">
					My Flights
				</a>
			</div>
			<div class="btn-group pull-left">
				<div ui-toggle="uiSidebarLeft" class="btn sidebar-toggle">
					<i class="fa fa-bars"></i>
				</div>
			</div>
			<div class="btn-group pull-right" ng-click="fullScreen()">
				<div class="btn">
					<i class="fa fa-arrows"></i>
				</div>
			</div>
		</div>
		<!-- App Body -->
		<div class="app-body">
			<div class="app-content">
				<div class="scrollable">
					<div class="scrollable-content">
						<div ui-view></div>
					</div>
				</div>
			</div>
		</div>

	</div>
</body>

</html>
